name: CI

# Run on pull requests targeting main (the default branch) and on pushes to
# main. Branch protection will eventually require this workflow's checks before merge.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Cancel an in-progress run when a branch/PR is updated, so only the newest
# commit consumes runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, assemble, lint
    runs-on: ubuntu-latest
    # Guards against a hung Gradle daemon consuming the 6-hour job limit.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Gradle runs on JDK 21 (satisfies the JDK 17+ requirement). The Android
      # app still compiles with Java/Kotlin target 17 (see app/build.gradle.kts),
      # and the host-side unit-test launcher requests a JDK 21 toolchain, which
      # resolves to this same JDK instead of triggering a Foojay download.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # compileSdk 36 and build-tools 36.0.0 are required by app/build.gradle.kts.
      # Install explicitly so the job does not depend on what the runner image
      # happens to preload.
      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run host-side unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Run Android lint (debug)
        run: ./gradlew :app:lintDebug --console=plain

      # Keep reports available for debugging even when a previous step failed.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
